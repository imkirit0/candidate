name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR, but never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE_NAME: courses-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    needs: test # build only if lint and tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for AWS, no long-lived access keys
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t $IMAGE_NAME:${{ github.sha }} .

      - name: Smoke test, container starts and /health reports this commit
        run: |
          docker run -d --name smoke -p 8000:8000 $IMAGE_NAME:${{ github.sha }}
          for i in $(seq 1 15); do
            if body=$(curl -fsS http://localhost:8000/health); then
              echo "$body"
              echo "$body" | grep -q '"version":"${{ github.sha }}"' && exit 0
              echo "unexpected version" && exit 1
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true

      # ---- Bonus: push to ECR, main only ----
      # Needs repository variables:
      #   AWS_REGION      e.g. ap-south-1
      #   AWS_ROLE_ARN    IAM role trusted for this repo via GitHub OIDC, allowed to
      #                   push to the one ECR repository only
      #   ECR_REPOSITORY  e.g. courses-api
      # No secrets needed: OIDC gives short-lived credentials per run.
      # The push steps are skipped until AWS_ROLE_ARN is set, so CI stays green in a
      # repo with no AWS account behind it.
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the exact image that was smoke tested
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        env:
          REMOTE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} "$REMOTE"
          docker push "$REMOTE"
